<style>
/* Layout concept: a full-bleed cartoon canvas (sky, hills, Zip's cannon, the Gloops) with a thin DOM layer on top for the question card, menus and buttons.
   Deliberately one bright, kid-sized look in both light and dark system themes: explicit colors everywhere. */
:root {
  --ink: #3a2358;
  --paper: #fffaf0;
  --sun: #ffc93c;
  --sun-deep: #e8a100;
  --coral: #ff6b6b;
  --coral-deep: #d94a4a;
  --mint: #3ddc97;
  --mint-deep: #1fa86f;
  --sky: #4cc9f0;
  --sky-deep: #1f9fcc;
  --grape: #8b5cf6;
  --grape-deep: #6538d4;
  --pink: #ff8fc7;
  --pink-deep: #e0559d;
  --font: 'Fredoka', 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: #8fdcff; color: var(--ink); font-family: var(--font);
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui {
  position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
button { font-family: var(--font); color: var(--ink); cursor: pointer; pointer-events: auto; touch-action: manipulation; }
button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 7px var(--grape); }

/* top bar */
#top { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: 560px; width: 100%; margin: 0 auto; }
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; min-width: 46px; padding: 0 12px; box-sizing: border-box;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 23px; box-shadow: 0 4px 0 var(--ink);
  font-weight: 700; font-size: 20px; line-height: 1;
}
button.chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.chip svg { width: 24px; height: 24px; display: block; }
#stars { pointer-events: auto; cursor: pointer; }
#stars b { font-size: 22px; font-variant-numeric: tabular-nums; }
#stars.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.3) rotate(-4deg); } 100% { transform: scale(1); } }
.right { position: relative; display: flex; gap: 8px; align-items: center; }
.lang { display: inline-flex; border: 4px solid var(--ink); border-radius: 23px; overflow: hidden; background: var(--paper); box-shadow: 0 4px 0 var(--ink); height: 46px; box-sizing: border-box; pointer-events: auto; }
.lang button { border: 0; background: transparent; font-weight: 700; font-size: 17px; padding: 0 12px; letter-spacing: .02em; }
.lang button[aria-pressed="true"] { background: var(--grape); color: #fff; }
#music.off { position: relative; }
#music.off::after { content: ''; position: absolute; left: 8px; right: 8px; top: 50%; height: 4px; margin-top: -2px; background: var(--coral); border-radius: 2px; transform: rotate(-38deg); box-shadow: 0 0 0 2px var(--paper); }

/* question card */
#prompt {
  position: relative; max-width: 480px; width: 100%; margin: 12px auto 0; box-sizing: border-box; padding: 12px 64px 12px 14px;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 6px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; animation: drop .55s cubic-bezier(.3, 1.5, .5, 1) both;
}
@keyframes drop { 0% { transform: translateY(-40px) scale(.9); opacity: 0; } 100% { transform: none; opacity: 1; } }
#pvis { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 6px; min-height: 64px; max-width: 100%; }
#pvis .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 2px; width: 100%; min-width: 0; }
#pvis .it { font-size: clamp(24px, 7.6vw, 38px); line-height: 1.1; display: inline-block; animation: pop .5s cubic-bezier(.3, 1.8, .5, 1) both; animation-delay: calc(var(--i) * 70ms); }
#pvis .it.gone { filter: grayscale(1); opacity: .3; }
@keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
#pvis .big { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: .02em; animation: pop .5s cubic-bezier(.3, 1.8, .5, 1) both; }
#pvis .big.eq { font-size: 52px; }
#pvis .word { font-size: 26px; font-weight: 600; }
#pvis .pic { font-size: 62px; line-height: 1; animation: pop .5s cubic-bezier(.3, 1.8, .5, 1) both; }
#ptext { font-size: 22px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
#speak {
  position: absolute; top: 50%; right: 10px; width: 48px; height: 48px; margin-top: -24px; padding: 0; border: 4px solid var(--ink); border-radius: 50%;
  background: var(--sun); box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center;
}
#speak svg { width: 26px; height: 26px; }
#speak:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
#speak.talk { animation: talk .5s ease-in-out infinite alternate; }
@keyframes talk { to { transform: scale(1.12) rotate(6deg); background: #ffe082; } }

/* screens */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 12px; pointer-events: none;
  padding-top: max(64px, calc(env(safe-area-inset-top, 0px) + 64px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; overflow-y: auto; }

.screen > :first-child { margin-top: auto; } .screen > :last-child { margin-bottom: auto; }
.screen:not([hidden]) { animation: fadein .35s both; }
@keyframes fadein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.logo { margin: 0; text-align: center; font-size: clamp(44px, 13vw, 72px); line-height: .95; font-weight: 700; color: var(--sun);
  -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); letter-spacing: .01em; text-wrap: balance; animation: float 3s ease-in-out infinite; }
.logo small:empty { display: none; } .logo .lg1 { margin: 0 0 4px; }
.logo small { display: block; font-size: .46em; color: #fff; -webkit-text-stroke: 5px var(--ink); text-shadow: 0 3px 0 var(--ink); margin-top: 8px; letter-spacing: .03em; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }
.btn {
  border: 5px solid var(--ink); border-radius: 36px; padding: 12px 34px; font-weight: 700; font-size: 30px; background: var(--mint); color: var(--ink);
  box-shadow: 0 8px 0 var(--ink); min-height: 64px;
}
.btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
.btn.alt { background: var(--sun); }
.btn.small { font-size: 22px; padding: 8px 24px; min-height: 52px; border-width: 4px; box-shadow: 0 6px 0 var(--ink); }
.btn.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(100%, 440px); }
.mode {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 76px; padding: 5px 8px 7px; box-sizing: border-box;
  border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 8px 0 var(--ink); font-weight: 700; font-size: 21px; line-height: 1.05; text-align: center;
  animation: pop .6s cubic-bezier(.3, 1.7, .5, 1) both; animation-delay: calc(var(--i) * 80ms);
}
.mode:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }

.mode .ico { font-size: 32px; line-height: 1; }
.mode .pips { display: flex; gap: 4px; margin-top: 2px; }
.mode .pips i { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--ink); background: rgba(255, 255, 255, .55); }
.mode .pips i.on { background: var(--sun); }
.m8 { background: linear-gradient(120deg, #ff8f8f, #ffd34d 35%, #6fe3b4 65%, #6fb7ff); } .m6 { background: #ff9a5c; } .m7 { background: #c3e86b; }
.m1 { background: #ff9ec1; } .m2 { background: #ffd34d; } .m3 { background: #6fe3b4; } .m4 { background: #a98bff; color: #fff; } .m5 { background: #6fd0ff; }
.m4 .pips i { background: rgba(255,255,255,.5); }
.panel {
  background: var(--paper); border: 5px solid var(--ink); border-radius: 34px; box-shadow: 0 8px 0 var(--ink); padding: 18px 20px; width: min(100%, 440px); box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; animation: drop .6s cubic-bezier(.3, 1.5, .5, 1) both;
}
.panel h2 { margin: 0; font-size: 34px; line-height: 1.05; text-wrap: balance; }
.panel p { margin: 0; font-size: 21px; font-weight: 500; text-wrap: balance; }
.bigstars { font-size: 44px; letter-spacing: 4px; }
.bigstars span { display: inline-block; animation: pop .6s cubic-bezier(.3, 1.8, .5, 1) both; animation-delay: calc(var(--i) * 140ms); }
.row2 { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#album-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-height: 46vh; overflow-y: auto; padding: 4px; box-sizing: border-box; }
#album-grid .tile { aspect-ratio: 1; display: grid; place-items: center; font-size: 38px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; }
#album-grid .tile.lock { background: #e6dff2; border-style: dashed; }
#album-grid .tile.lock span { filter: grayscale(1) brightness(.2); opacity: .22; }
#sticker-pic { font-size: 110px; line-height: 1; animation: pop .8s cubic-bezier(.3, 1.9, .5, 1) both; filter: drop-shadow(0 6px 0 rgba(58, 35, 88, .25)); }
.shine { animation: shine 1.5s ease-in-out infinite alternate; }
@keyframes shine { to { transform: rotate(6deg) scale(1.06); } }
#albumbtn { margin-top: 2px; }
#menu .row2 { flex-wrap: nowrap; gap: 8px; width: min(100%, 440px); } #menu .row2 .btn { font-size: 18px; padding: 8px 8px; min-height: 48px; flex: 1; border-width: 4px; box-shadow: 0 5px 0 var(--ink); white-space: nowrap; } #trcount { font-size: 15px; }

/* adventure button, trophies, adventure map, puzzle, toast */
.advbtn { display: flex; align-items: center; gap: 14px; width: min(100%, 440px); box-sizing: border-box; padding: 6px 18px; text-align: left; border: 5px solid var(--ink); border-radius: 32px; box-shadow: 0 8px 0 var(--ink);
  background: linear-gradient(100deg, #ffd34d, #ff8a7a); animation: pop .6s cubic-bezier(.3, 1.7, .5, 1) both; }
.advbtn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }

.advbtn small { display: block; font-size: 17px; font-weight: 500; margin-top: 3px; }

.panel.tall { width: min(100%, 460px); }
#tr-scroll { width: 100%; max-height: 54vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 6px; box-sizing: border-box; text-align: left; }

.bar { display: block; height: 12px; border: 3px solid var(--ink); border-radius: 8px; background: #efe9f7; margin-top: 5px; overflow: hidden; box-sizing: content-box; }
.bar u { display: block; height: 100%; background: var(--mint); text-decoration: none; }

.ach:not(.on) { background: #ece6f4; border-style: dashed; } .ach:not(.on) b { opacity: .55; } .ach:not(.on) small { opacity: .5; }
#adv-path { display: flex; align-items: center; justify-content: center; gap: 4px; }
.stop { position: relative; width: 46px; height: 46px; border: 4px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: #e6dff2; box-sizing: border-box; flex: none; }
.stop.done { background: var(--mint); } .stop.cur { background: var(--sun); animation: pulse 1.2s ease-in-out infinite; }
.stop.done::after { content: '✓'; position: absolute; right: -6px; bottom: -8px; font-size: 15px; font-weight: 700; background: #fff; border: 3px solid var(--ink); border-radius: 50%; width: 22px; height: 22px; line-height: 17px; text-align: center; box-sizing: border-box; }

#slots, #tray { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 520px; }
.slot { width: var(--sw, 56px); height: 68px; border: 4px dashed var(--ink); border-radius: 18px; background: rgba(255, 255, 255, .7); display: grid; place-items: center; font-size: 42px; font-weight: 700; box-sizing: border-box; }
.slot.given { border-style: solid; background: #fff; }
.slot.filled { border-style: solid; background: var(--sun); animation: pop .4s cubic-bezier(.3, 1.8, .5, 1) both; }
.slot.target { box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--sun); }
.ptile { width: 58px; height: 66px; border: 5px solid var(--ink); border-radius: 20px; background: var(--c, var(--pink)); box-shadow: 0 6px 0 var(--ink); font-size: 44px; font-weight: 700; display: grid; place-items: center;
  pointer-events: auto; touch-action: none; cursor: grab; position: relative; box-sizing: border-box; animation: pop .5s cubic-bezier(.3, 1.8, .5, 1) backwards; animation-delay: var(--d, 0ms); }

    const f = mf(m), g = ac.createGain(), g2 = ac.createGain();
    const o = ac.createOscillator(), o2 = ac.createOscillator();
    o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 2; g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out || musicG);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function tone(type, f0, f1, t, dur, vol, out) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || sfxG); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol, hp, out) {
    const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out || sfxG); s.start(t); s.stop(t + dur + 0.02);
  }
  function playStep(st, t) {
    const sg = SONGS[track], bar = Math.floor(st / 8), i = st % 8, n = sg.mel[st];
    if (n) pluck(n, t, track === 'menu' ? 0.32 : 0.5, track === 'menu' ? 0.42 : 0.34);
    const root = sg.bass[bar % 8];
    if (i === 0) pluck(root - 12 + 12, t, 0.55, 0.5);
    if (i === 4) pluck(root + 7 - (root + 7 > 55 ? 12 : 0), t, 0.4, 0.3);
    if (sg.shake && i % 2 === 1) noise(t, 0.05, 0.05, 7000, musicG);
    if (!sg.shake && i === 4) noise(t, 0.06, 0.035, 6000, musicG);
  }
  function tick() {
    if (!ac) return;
    const sg = SONGS[track];
    while (nextT < ac.currentTime + 0.25) {
      playStep(step, nextT);
      nextT += 60 / sg.bpm / 2; step = (step + 1) % 64;
    }
  }
  function startMusic() {
    if (!ac || timer) return;
    nextT = ac.currentTime + 0.08;
    timer = setInterval(tick, 60);
  }
  function stopMusic() { if (timer) { clearInterval(timer); timer = null; } }
  function applyMaster() { if (!ac) return; master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime((musicOn || voiceOn) ? 0.9 : 0, ac.currentTime, 0.03); musicG.gain.cancelScheduledValues(ac.currentTime); musicG.gain.setTargetAtTime(musicOn ? (ducked ? 0.06 : 0.2) : 0, ac.currentTime, 0.03); }
  function Snd_duck(sec) { if (!ac || !musicOn) return; musicG.gain.setTargetAtTime(0.05, ac.currentTime, 0.05); setTimeout(() => { if (!ducked && ac && musicOn) musicG.gain.setTargetAtTime(0.2, ac.currentTime, 0.15); }, sec * 1000); }
  return {
    unlock,
    get on() { return musicOn; },
    get voiceOn() { return voiceOn; },
    setMusic(on) { musicOn = on; save.music = on; persist(); if (!ac) return; applyMaster(); if (on) startMusic(); else stopMusic(); },
    setVoice(on) { voiceOn = on; save.voice = on; persist(); applyMaster(); },
    setTrack(n) { if (track !== n) { track = n; step = 0; if (ac) nextT = ac.currentTime + 0.1; } },
    duckFor(sec) { Snd_duck(sec); },
    duck(on) { ducked = on; if (ac && musicOn) musicG.gain.setTargetAtTime(on ? 0.06 : 0.2, ac.currentTime, 0.12); },
    suspend(h) { if (!ac) return; if (h) ac.suspend(); else ac.resume(); },
    shoot() { if (!ac) return; const t = ac.currentTime; tone('sine', 420, 1100, t, 0.2, 0.28); noise(t, 0.1, 0.08, 4000); },
    pop() { if (!ac) return; const t = ac.currentTime; tone('triangle', 800, 140, t, 0.2, 0.5); noise(t, 0.12, 0.2, 2500); },
    good() { if (!ac) return; const t = ac.currentTime; [72, 76, 79, 84].forEach((m, k) => pluck(m, t + k * 0.085, 0.5, 0.55, sfxG)); },
    bad() { if (!ac) return; const t = ac.currentTime; tone('sine', 360, 270, t, 0.2, 0.3); tone('sine', 280, 210, t + 0.16, 0.26, 0.28); },
    click() { if (!ac) return; tone('sine', 700, 900, ac.currentTime, 0.08, 0.3); },
    star() { if (!ac) return; pluck(91, ac.currentTime, 0.3, 0.35, sfxG); },
    sticker() { if (!ac) return; const t = ac.currentTime; [72, 76, 79, 84, 88, 91].forEach((m, k) => pluck(m, t + k * 0.1, 0.7, 0.5, sfxG)); },
    honk() { if (!ac) return; const t = ac.currentTime; [0, 0.22].forEach((o) => { tone('square', 349, 349, t + o, 0.16, 0.1); tone('square', 440, 440, t + o, 0.16, 0.1); }); },
    vroom() { if (!ac) return; const t = ac.currentTime; tone('sawtooth', 80, 240, t, 0.85, 0.07); noise(t, 0.5, 0.04, 400); },
    drop() { if (!ac) return; const t = ac.currentTime; pluck(79, t, 0.3, 0.45, sfxG); noise(t, 0.05, 0.1, 3000); },
    whoosh() { if (!ac) return; const t = ac.currentTime; noise(t, 0.25, 0.06, 1500); }
  };
})();

/* ---------------------------------------------------------------- voice */
const Voice = (() => {
  let voices = [], utter = null, safety = 0;
  const ok = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  const load = () => { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } };
  if (ok) { load(); try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { /* ignore */ } }
  const pickVoice = (lang) => {
    const prefs = lang === 'fr' ? ['fr-CA', 'fr-FR', 'fr'] : ['en-CA', 'en-US', 'en-GB', 'en'];
    for (const p of prefs) { const v = voices.find((x) => x.lang && x.lang.replace('_', '-').toLowerCase().startsWith(p.toLowerCase())); if (v) return v; }
    return null;
  };
  const speakBtn = $('speak');
  const done = () => { Snd.duck(false); speakBtn.classList.remove('talk'); clearTimeout(safety); };
  let primed = false, warned = false;
  const warn = () => { if (warned) return; warned = true; Prog.toast('🔇', L === 'fr' ? 'Pas de voix sur cet appareil' : 'No voice on this device', L === 'fr' ? 'Essaie Chrome ou Safari' : 'Try Chrome or Safari'); };
  return {
    ok, warn,
    prime() {
      if (!ok || primed) return; primed = true;
      try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
    },
    say(text, cb, hooks) {
      if (!ok || !text || !Snd.voiceOn) { if (cb) setTimeout(cb, 0); return; }
      try {
        const busy = speechSynthesis.speaking || speechSynthesis.pending;
        if (busy) speechSynthesis.cancel();
        try { speechSynthesis.resume(); } catch (e) { /* ignore */ }
        const u = new SpeechSynthesisUtterance(text);
        utter = u;
        u.lang = L === 'fr' ? 'fr-CA' : 'en-US';
        const v = pickVoice(L); if (v) { u.voice = v; u.lang = v.lang; }
        u.rate = (hooks && hooks.rate) || 0.84; u.pitch = 1.12; u.volume = 1;
        u.onstart = () => { Snd.duck(true); speakBtn.classList.add('talk'); if (hooks && hooks.onstart) hooks.onstart(); };
        if (hooks && hooks.onboundary) u.onboundary = (ev) => { if (ev && (ev.name === undefined || ev.name === 'word')) hooks.onboundary(ev.charIndex | 0); };
        u.onend = () => { if (utter === u) done(); if (cb) cb(); };
        u.onerror = (ev) => { if (utter === u) done(); if (ev && (ev.error === 'not-allowed' || ev.error === 'synthesis-unavailable' || ev.error === 'language-unavailable')) warn(); };
        const go = () => { try { speechSynthesis.speak(u); } catch (e) { done(); } };
        if (busy) setTimeout(go, 80); else go();
        clearTimeout(safety); safety = setTimeout(done, 9000);
      } catch (e) { done(); }
    },
    stop() { if (!ok) return; try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } done(); }
  };
})();

const Prog = (() => {
  const two = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate());
  const hashStr = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const seeded = (seed) => () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  let streak = 0;
  const queue = []; let showing = false;

  function newDay(d) {
    const r = seeded(hashStr(d));
    const A = [{ type: 'right', n: r() < 0.5 ? 10 : 14 }, { type: 'first', n: r() < 0.5 ? 6 : 8 }, { type: 'stars', n: r() < 0.5 ? 10 : 14 }];
    const B = [{ type: 'streak', n: r() < 0.5 ? 3 : 4 }, { type: 'rounds', n: 2 }];
    const m = MODES_ALL[Math.floor(r() * MODES_ALL.length)];
    const ch = [A[Math.floor(r() * 3)], B[Math.floor(r() * 2)], { type: 'mode', n: 1, mode: m }].map((c, i) => Object.assign({ id: 'c' + i }, c));
    return { d, ch, done: {}, rounds: 0, right: 0, first: 0, stars: 0, best: 0, mode: {}, all: false };
  }
  function ensureDay() {
    const d = keyOf(new Date());
    if (!save.day || save.day.d !== d) save.day = newDay(d);
    return save.day;
  }
  function touchDay() {
    const D = ensureDay();
    if (save.dayStreak.last !== D.d) {
      const y = keyOf(new Date(Date.now() - 86400000));
      save.dayStreak.n = save.dayStreak.last === y ? save.dayStreak.n + 1 : 1; save.dayStreak.last = D.d;
    }
    return D;
  }
  const val = (c) => {
    const D = save.day;
    switch (c.type) {
      case 'right': return D.right; case 'first': return D.first; case 'stars': return D.stars;
      case 'streak': return D.best; case 'rounds': return D.rounds; case 'mode': return D.mode[c.mode] || 0;
      default: return 0;
    }
  };
  const label = (c) => {
    const n = c.n, fr = L === 'fr';
    switch (c.type) {
      case 'right': return fr ? `Réponds juste à ${n} questions` : `Answer ${n} questions correctly`;
      case 'first': return fr ? `${n} bonnes réponses du premier coup` : `${n} right answers on the first try`;
      case 'stars': return fr ? `Gagne ${n} étoiles` : `Earn ${n} stars`;
      case 'streak': return fr ? `${n} bonnes réponses de suite` : `${n} right answers in a row`;
      case 'rounds': return fr ? `Termine ${n} parties` : `Finish ${n} rounds`;
      case 'mode': return (fr ? 'Joue une partie : ' : 'Play a round: ') + (UI[L]['m_' + c.mode] || '');
      default: return '';
    }
  };

  function toast(ic, title, sub) { queue.push({ ic, title, sub }); next(); }
  function next() {
    if (showing || !queue.length) return;
    showing = true;
    const q = queue.shift(), el = $('toast');
    el.querySelector('.ti').textContent = q.ic; el.querySelector('.tt').textContent = q.title; el.querySelector('.ts').textContent = q.sub;
    el.hidden = false; el.classList.remove('out'); void el.offsetWidth; el.classList.add('in');
    Snd.star(); setTimeout(() => Snd.good(), 120);
    setTimeout(() => { el.classList.remove('in'); el.classList.add('out'); }, 3000);
    setTimeout(() => { el.hidden = true; showing = false; next(); }, 3400);
  }

  function check() {
    const D = ensureDay(); let bonus = 0;
    D.ch.forEach((c) => {
      if (!D.done[c.id] && val(c) >= c.n) { D.done[c.id] = true; save.st.chals++; bonus += 3; toast('🎯', TX[L].chalDone, label(c)); }
    });
    if (!D.all && D.ch.every((c) => D.done[c.id])) { D.all = true; save.st.alldays++; bonus += 5; toast('🥇', TX[L].chalAll, '+5 ⭐'); }
    ACH.forEach((a) => {
      if (!save.ach[a.id] && a.ok(save)) { save.ach[a.id] = true; bonus += 2; toast(a.ic, TX[L].achNew, a[L][0]); }
    });
    if (bonus) addStars(bonus);
    persist(); updateBtn();
  }
  function answer(first) {
    const D = touchDay();
    save.st.right++; D.right++;
    if (first) { save.st.first++; D.first++; streak++; } else streak = 0;
    if (streak > save.st.best) save.st.best = streak;
    if (streak > D.best) D.best = streak;
  }
  function round(mode, perfect) {
    const D = touchDay();
    save.st.rounds++; D.rounds++; D.mode[mode] = (D.mode[mode] || 0) + 1; save.st.mode[mode] = (save.st.mode[mode] || 0) + 1;
    if (perfect) save.st.perfect++;
  }
  function updateBtn() {
    const D = ensureDay(), n = D.ch.filter((c) => D.done[c.id]).length;
    $('trcount').textContent = n + '/' + D.ch.length;
  }
  function render() {
    const D = ensureDay();
    $('chal-list').innerHTML = D.ch.map((c) => {
      const v = Math.min(val(c), c.n), done = !!D.done[c.id];
      return `<div class="chal${done ? ' done' : ''}"><span class="ci">${done ? '✅' : '🎯'}</span><div class="cx"><b>${label(c)}</b><i class="bar"><u style="width:${Math.round((v / c.n) * 100)}%"></u></i></div><span class="cn">${v}/${c.n}</span></div>`;
    }).join('');
    let n = 0;
    $('ach-list').innerHTML = ACH.map((a) => {
      const on = !!save.ach[a.id]; if (on) n++;
      return `<div class="ach${on ? ' on' : ''}"><span class="ai">${on ? a.ic : '🔒'}</span><div><b>${a[L][0]}</b><small>${a[L][1]}</small></div></div>`;
    }).join('');
    $('ach-count').textContent = n + ' / ' + ACH.length;
  }
  return { toast, ensureDay, answer, miss() { streak = 0; }, round, check, render, updateBtn, get streak() { return streak; } };
})();

GEN.race = function (lv) {

  const q = GEN[pick(pool)](lv), ans = q.opts.find((o) => o.val === q.ans);

  q.opts = shuffle([ans, ...others]);

function imgFor(k) {
  /* Pre-rasterise each picture once into a canvas. Drawing an SVG-with-embedded-photo image directly every frame

  if (!IMGS[k]) {

function tickFrame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  drawBackground(dt);
  // Zip animation
  zip.recoil *= Math.pow(0.0005, dt); zip.sq *= Math.pow(0.002, dt);
  if (S.screen === 'splash' || S.screen === 'menu') zip.aimTo = -Math.PI / 2 + Math.sin(T * 0.8) * 0.5;
  zip.aim += (zip.aimTo - zip.aim) * Math.min(1, dt * 16);
  if (zip.moodT > 0) { zip.moodT -= dt; if (zip.moodT <= 0) zip.mood = 'idle'; }
  if (zip.hop > 0) { zip.hop += dt * 1.6; if (zip.hop >= 2) zip.hop = 0; }
  zip.nextBlink -= dt; if (zip.nextBlink <= 0) { zip.blink = 0.12; zip.nextBlink = 2 + Math.random() * 3; } if (zip.blink > 0) zip.blink -= dt;
  const kind = kindNow();
  if (kind === 'race') { raceStep(dt); drawRace(); drawParts(dt); return; }
  if (S.screen === 'play') {
    if (kind === 'drive') drawRoads();
    if (kind === 'detect') drawDetect(dt); else for (const b of blobs) drawBlob(b);
    if (kind === 'drive') carStep();
    if (kind === 'shoot' && bubble) {
      bubble.p += dt / 0.42;
      if (bubble.p >= 1) { const b = bubble.blob; bubble = null; bubbleHit(b); }
    }
    S.idle += S.canTap ? dt : 0;
    if (S.canTap && S.idle > 12 && !S.nudged) { S.nudged = true; Voice.say(S.q.say); blobs.forEach((b) => { if (b.state === 'idle') { b.state = 'shake'; b.t0 = T + 0; } }); }
  }
  if (kind === 'drive') drawCar(); else if (kind !== 'detect') drawZip();
  drawBubble(); drawFriend(); drawParts(dt);
}

cv.addEventListener('pointerdown', (e) => {
  Snd.unlock();
  if (S.screen === 'play' && S.mode === 'race') { raceDrag = true; raceTap(e.clientX, true); return; }
  if (S.screen !== 'play' || !S.canTap) return;
  S.idle = 0;

  if (kindNow() === 'drive' && car.mode === 'idle' && Math.hypot(e.clientX - car.x, e.clientY - car.y) < 80) {
    let b0 = null, bd0 = 1e9; for (const b of blobs) { const d = Math.abs(car.x - b.bx); if (d < bd0) { bd0 = d; b0 = b; } }
    car.mode = 'steer'; car.st = { b: b0, t: 0, tt: 0 }; steer.on = true; steer.id = e.pointerId; return;
  }
  let best = null, bd = 1e9;
  for (const b of blobs) {
    if (b.state === 'in' || b.state === 'gone' || b.state === 'out') continue;
    const x = b.cx != null ? b.cx : b.bx, y = b.cy != null ? b.cy : b.by, d = Math.hypot(e.clientX - x, e.clientY - y);
    if (d < b.r * 1.25 && d < bd) { best = b; bd = d; }
  }

});
